<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Driftless Reader</title>
    <style>
      :root {
        --bg: #14072f;
        --fg: #fff;
        --muted: #d9ccff;
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(900px 500px at 80% -20%, #6d28d9 0%, transparent 60%),
          linear-gradient(160deg, #2a0a6b, #14072f);
        color: var(--fg);
        font:
          17px/1.6 system-ui,
          'Segoe UI',
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 640px;
        padding: 40px 20px;
      }
      img.logo {
        border-radius: 28px;
        box-shadow: 0 16px 50px rgb(0 0 0/0.4);
      }
      h1 {
        font-size: 40px;
        margin: 20px 0 4px;
      }
      p {
        color: var(--muted);
      }
      a {
        color: #fff;
      }
      .links {
        display: flex;
        gap: 18px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 24px;
      }
      .shot {
        width: 100%;
        border-radius: 14px;
        margin-top: 28px;
        box-shadow: 0 20px 60px rgb(0 0 0/0.45);
      }
    </style>
  </head>
  <body>
    <main>
      <img
        class="logo"
        src="store/images/edge-logo.png"
        width="120"
        height="120"
        alt="Driftless Reader logo"
      />
      <h1>Driftless Reader</h1>
      <p>
        Stay with the text. An ADHD-friendly way to read the web, with Drift Guard, an anchor
        marker, Read Aloud, Focus View, a focus band and Chunk mode. Free and open source.
      </p>
      <div class="links">
        <a href="privacy.html">Privacy policy</a>
        <a href="https://buymeacoffee.com/mathpfran">Buy me a coffee ☕</a>
        <a href="https://github.com/mfranceschini/driftless-reader-web-extension">Source code</a>
        <a href="https://github.com/mfranceschini/driftless-reader-web-extension/issues">Support</a>
      </div>
      <img class="shot" src="store/images/screenshot-1.png" alt="Chunk mode in Driftless Reader" />
    </main>
  </body>
</html>
